<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mukhaddar Saw Mill - Gallery</title>
    <style>
        :root { --primary: #8B4513; --primary-dark: #5a2d0c; --bg-light: #fdfaf6; --border-color: #ebdcd0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-light); }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); }
        nav a { text-decoration: none; color: #66554b; margin-left: 22px; font-weight: 500; padding: 6px 12px; border-radius: 4px; transition: all 0.3s ease; }
        nav a:hover, nav a.active { color: var(--primary); background: #fdf3eb; font-weight: bold; }
        
        main { max-width: 1200px; margin: 45px auto; padding: 0 20px; }
        .animate-fade-in { animation: professionalFade 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        .animate-slide-up { animation: elegantSlideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; animation-delay: 0.15s; }
        @keyframes professionalFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes elegantSlideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        .gallery-item { transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .gallery-item:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(139, 69, 19, 0.12); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; margin-top: 30px; }
        .gallery-item { background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
        .gallery-item img { width: 100%; height: 230px; object-fit: cover; display: block; }
        .gallery-desc { padding: 15px; font-weight: 600; color: var(--primary-dark); text-align: center; background: #fffcf9; }
        footer { background-color: #261910; color: #e7ded7; text-align: center; padding: 30px; margin-top: 80px; font-size: 14px; border-top: 3px solid var(--primary); }
    </style>
</head>
<body>
    <header>
        <div class="logo">🪵 Mukhaddar Saw Mill</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="calculator.html">Rates & Calculator</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main class="animate-fade-in">
        <h2 style="text-align:center; color: var(--primary-dark);">Industrial Sawmill Work Gallery</h2>
        <div class="gallery-grid animate-slide-up">
            <div class="gallery-item"><img src="https://unsplash.com"><div class="gallery-desc">Raw Round Log Stock Management</div></div>
            <div class="gallery-item"><img src="https://unsplash.com"><div class="gallery-desc">Heavy Duty Mechanical Slicing</div></div>
            <div class="gallery-item"><img src="https://unsplash.com"><div class="gallery-desc">Processed Planed Product Stacks</div></div>
        </div>
    </main>
    <footer><p>© 2026 Mukhaddar Saw Mill. All Rights Reserved.</p></footer>
</body>
</html>
